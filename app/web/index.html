<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VodSync 管理面板</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --line: #e3e8ef;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --ok: #16a34a;
    --bad: #dc2626;
    --warn: #d97706;
  }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 14px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
  }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 24px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card .value small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 18px; overflow: hidden;
  }
  .panel > .head {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .panel > .head h2 { font-size: 14px; margin: 0; font-weight: 600; }
  .panel > .head .hint { color: var(--muted); font-size: 12px; }
  .panel > .body { padding: 0; overflow-x: auto; }
  .panel > .body.pad { padding: 14px 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { background: #fafbfc; color: var(--muted); font-weight: 500; white-space: nowrap; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  td.num { font-variant-numeric: tabular-nums; }
  .name { font-weight: 550; }
  .slugcode { color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px;
    border: 1px solid transparent; white-space: nowrap;
  }
  .badge.ok { color: var(--ok); background: #ecfdf3; border-color: #c7f0d6; }
  .badge.bad { color: var(--bad); background: #fef2f2; border-color: #fbd5d5; }
  .badge.warn { color: var(--warn); background: #fffbeb; border-color: #fde9b8; }
  .pause-banner {
    background: #fffbeb; border: 1px solid #fde9b8; color: #92400e;
    padding: 9px 16px; border-radius: 10px; margin-bottom: 18px; font-size: 13px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .pause-banner b { font-weight: 650; }
  .switch input { accent-color: var(--warn); width: 15px; height: 15px; cursor: pointer; }
  .switch.paused { color: var(--warn); font-weight: 600; }
  .badge.mute { color: var(--muted); background: #f3f4f6; border-color: var(--line); }
  .badge.run { color: var(--accent); background: #eff4ff; border-color: #cfdcfd; display: inline-flex; align-items: center; gap: 4px; }
  .badge.run::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  button {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--text); transition: .15s;
  }
  button:hover { border-color: #c9d2e0; background: #f8fafc; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button.danger { color: var(--bad); border-color: #fbd5d5; background: #fff; }
  button.danger:hover { background: #fef2f2; }
  button.warn { color: var(--warn); border-color: #fde9b8; background: #fff; }
  button.warn:hover { background: #fffbeb; }
  button.sm { padding: 3px 9px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input[type=text], input[type=search] {
    font: inherit; padding: 7px 11px; border: 1px solid var(--line); border-radius: 7px;
    background: #fff; color: var(--text); min-width: 260px; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
  .bar { height: 6px; background: #eef1f5; border-radius: 999px; overflow: hidden; min-width: 70px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
  .bar > i.done { background: var(--ok); }
  .bar > i.live {
    background: linear-gradient(90deg, var(--accent) 0%, #60a5fa 50%, var(--accent) 100%);
    background-size: 200% 100%; animation: flow 1.6s linear infinite;
  }
  @keyframes flow { from { background-position: 200% 0; } to { background-position: 0 0; } }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .empty { padding: 26px; text-align: center; color: var(--muted); }
  #toast {
    position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 50;
  }
  #toast .item {
    background: #111827; color: #fff; padding: 9px 14px; border-radius: 8px; font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); animation: in .18s ease-out; max-width: 380px;
  }
  #toast .item.err { background: #b91c1c; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .result-item { display: flex; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
  .result-item:last-child { border-bottom: none; }
  .result-item img { width: 46px; height: 64px; object-fit: cover; border-radius: 6px; background: #eef1f5; flex: none; }
  .result-item .meta { min-width: 0; flex: 1; }
  .result-item .title { font-weight: 550; }
  .result-item .line2 { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(17,24,39,.42); display: flex; align-items: center;
    justify-content: center; padding: 24px; z-index: 40;
  }
  .modal {
    background: #fff; border-radius: 12px; width: min(720px, 100%); max-height: 82vh; overflow: auto;
    box-shadow: 0 24px 60px rgba(0,0,0,.25); padding: 20px 22px;
  }
  .modal h3 { margin: 0 0 4px; font-size: 16px; }
  .modal .kv { color: var(--muted); font-size: 12px; margin-bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
  .modal .content { white-space: pre-wrap; font-size: 13px; background: #fafbfc; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-height: 180px; overflow: auto; }
  .ep { display: inline-block; margin: 4px 6px 0 0; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; background: #fff; text-decoration: none; color: var(--accent); }
  .ep:hover { background: #eff6ff; }
  .switch { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>VodSync 管理面板</h1>
  <span class="sub" id="serverTime">--</span>
  <span class="spacer"></span>
  <label class="switch"><input type="checkbox" id="autoRefresh" checked> 每 5 秒自动刷新</label>
  <button class="sm" id="btnReload">立即刷新</button>
</header>

<main>
  <!-- 概览 -->
  <section class="cards">
    <div class="card"><div class="label">源站总数</div><div class="value" id="statSources">-<small id="statEnabled"></small></div></div>
    <div class="card"><div class="label">已入库视频总量</div><div class="value" id="statVideos">-</div></div>
    <div class="card"><div class="label">正在同步</div><div class="value" id="statSyncing">-</div></div>
    <div class="card"><div class="label">今日新增 / 更新</div><div class="value" id="statToday">-</div></div>
  </section>

  <!-- 操作区 -->
  <section class="panel">
    <div class="head">
      <h2>操作</h2>
      <span class="hint">所有操作在后台执行，可反复点击刷新进度</span>
      <span class="spacer" style="flex:1"></span>
    </div>
    <div class="body pad">
      <div class="row">
        <button id="btnRefreshSources">刷新源站列表</button>
        <button id="btnSyncAll">全站增量同步</button>
        <button class="danger" id="btnSyncAllFull">全站全量同步</button>
        <button id="btnRecount">条数校准</button>
        <button id="btnSourceApi">资源站 API</button>
        <span class="muted" style="font-size:12px">全量同步会从第一页重新抓取，仅建议在数据异常时使用</span>
      </div>
    </div>
  </section>

  <!-- 同步暂停控制 -->
  <div id="pauseBanner" class="pause-banner" style="display:none">
    ⏸ <b>同步已暂停</b>：<span id="pauseBannerText"></span>
    <span class="muted" style="font-size:12px">进行中的批次已在检查点停止并保存断点，关闭开关后自动续传</span>
  </div>
  <section class="panel">
    <div class="head">
      <h2>同步暂停控制</h2>
      <span class="hint">优雅停止：当前抓取批次完成后保存断点再停，不丢数据；暂停状态重启后仍保留</span>
    </div>
    <div class="body pad">
      <div class="row" style="gap:22px;flex-wrap:wrap">
        <label class="switch" id="swGlobalLabel"><input type="checkbox" id="pauseGlobal"> 全局暂停（全量+增量+定时任务）</label>
        <label class="switch" id="swFullLabel"><input type="checkbox" id="pauseFull"> 暂停全量同步</label>
        <label class="switch" id="swIncrLabel"><input type="checkbox" id="pauseIncr"> 暂停增量同步</label>
        <span class="muted" id="pauseHint" style="font-size:12px"></span>
      </div>
    </div>
  </section>

  <!-- 聚合搜索 -->
  <section class="panel">
    <div class="head">
      <h2>聚合搜索</h2>
      <span class="hint">跨全部源站按名称搜索，结果按更新时间倒序</span>
    </div>
    <div class="body pad">
      <form class="row" id="searchForm">
        <input type="search" id="searchInput" placeholder="输入影视名称关键词，例如：三体" autocomplete="off">
        <button class="primary" type="submit">搜索</button>
        <span class="muted" id="searchInfo" style="font-size:12px"></span>
      </form>
    </div>
    <div class="body" id="searchResults"></div>
  </section>

  <!-- 源站列表 -->
  <section class="panel">
    <div class="head">
      <h2>源站同步状态</h2>
      <span class="hint" id="sourcesHint"></span>
    </div>
    <div class="body" id="sourcesBody"><div class="empty">加载中…</div></div>
  </section>

  <!-- 同步日志 -->
  <section class="panel">
    <div class="head">
      <h2>最近同步日志</h2>
      <span class="hint">最多显示 20 条</span>
    </div>
    <div class="body" id="logsBody"><div class="empty">加载中…</div></div>
  </section>
</main>

<div id="toast"></div>

<script>
"use strict";

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));
const fmtNum = (n) => Number(n || 0).toLocaleString("zh-CN");
const fmtTime = (s) => s ? String(s).replace("T", " ").slice(0, 19) : "-";
// 运行时长：45s / 3m20s / 1h05m
const fmtDur = (sec) => {
  const n = Math.max(0, Math.round(Number(sec) || 0));
  if (n < 60) return `${n}s`;
  if (n < 3600) return `${Math.floor(n / 60)}m${String(n % 60).padStart(2, "0")}s`;
  return `${Math.floor(n / 3600)}h${String(Math.floor((n % 3600) / 60)).padStart(2, "0")}m`;
};

function toast(msg, isErr) {
  const el = document.createElement("div");
  el.className = "item" + (isErr ? " err" : "");
  el.textContent = msg;
  $("#toast").appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

function getKey() { return localStorage.getItem("vodsync_key") || ""; }

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  const k = getKey();
  if (k) headers["X-API-Key"] = k;
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  if (res.status === 401) {
    const input = window.prompt("该服务已启用 API Key，请输入访问密钥：", k);
    if (input) {
      localStorage.setItem("vodsync_key", input.trim());
      return api(path, opts);
    }
    throw new Error("未授权（缺少 API Key）");
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return res.json();
}

// ---------------- 同步暂停控制 ----------------
let pauseState = { global: false, full: false, incremental: false };
let pauseBusy = false;   // 开关请求进行中时，轮询不覆盖用户操作

const PAUSE_LABELS = {
  global: "全局暂停（全量+增量+定时任务全部停止）",
  full: "全量同步已暂停（断点已保存，继续后自动续传）",
  incremental: "增量同步已暂停（水位线未动，继续后自动重跑）",
};

async function loadPause() {
  try {
    const p = await api("/api/v1/pause");
    pauseState = p;
    if (!pauseBusy) {
      $("#pauseGlobal").checked = !!p.global;
      $("#pauseFull").checked = !!p.full;
      $("#pauseIncr").checked = !!p.incremental;
    }
    // 开关视觉状态
    $("#swGlobalLabel").classList.toggle("paused", !!p.global);
    $("#swFullLabel").classList.toggle("paused", !!p.full);
    $("#swIncrLabel").classList.toggle("paused", !!p.incremental);
    // 横幅与提示
    const active = ["global", "full", "incremental"].filter((k) => p[k]);
    if (active.length) {
      $("#pauseBanner").style.display = "flex";
      $("#pauseBannerText").textContent = active.map((k) => PAUSE_LABELS[k]).join("；");
      $("#pauseHint").textContent = "暂停中，同步任务会在检查点停止";
    } else {
      $("#pauseBanner").style.display = "none";
      $("#pauseHint").textContent = "";
    }
  } catch (e) { /* 静默：暂停状态加载失败不阻塞页面 */ }
}

async function togglePause(scope, checkbox) {
  const want = checkbox.checked;
  pauseBusy = true;
  try {
    const path = want ? "/api/v1/pause" : "/api/v1/resume";
    const res = await api(`${path}?scope=${scope}`, { method: "POST" });
    pauseState = res.state || pauseState;
    if (want) {
      toast(`已暂停（${scope}）`);
    } else {
      toast(`已继续（${scope}）${(res.resumed_sources || []).length ? `，续跑 ${res.resumed_sources.length} 个源站` : ""}`);
      // 继续后立即刷新同步进度
      loadSources();
    }
  } catch (e) {
    toast((want ? "暂停" : "继续") + "失败：" + e.message, true);
    checkbox.checked = !want;   // 失败回滚开关状态
  } finally {
    pauseBusy = false;
    loadPause();
  }
}

$("#pauseGlobal").addEventListener("change", (e) => togglePause("global", e.target));
$("#pauseFull").addEventListener("change", (e) => togglePause("full", e.target));
$("#pauseIncr").addEventListener("change", (e) => togglePause("incremental", e.target));

// ---------------- 概览 ----------------
async function loadStats() {
  try {
    const s = await api("/api/v1/stats");
    $("#statSources").innerHTML = fmtNum(s.sources_total) + `<small>启用 ${fmtNum(s.sources_enabled)}</small>`;
    $("#statVideos").textContent = fmtNum(s.videos_total);
    $("#statSyncing").innerHTML = fmtNum(s.sources_syncing)
      + (s.sources_unfinished ? `<small>${fmtNum(s.sources_unfinished)} 站有断点</small>` : "");
    $("#statToday").innerHTML = `${fmtNum(s.today_inserted)}<small>/ ${fmtNum(s.today_updated)} 更新</small>`;
    $("#serverTime").textContent = "服务器时间 " + fmtTime(s.server_time);
    if (s.last_error) {
      $("#serverTime").textContent += `　最近失败：${s.last_error.slug}`;
    }
  } catch (e) { toast("概览加载失败：" + e.message, true); }
}

// ---------------- 源站列表 ----------------
async function loadSources() {
  try {
    const data = await api("/api/v1/sources");
    const list = data.list || [];
    $("#sourcesHint").textContent = `共 ${list.length} 个源站`;
    if (!list.length) {
      $("#sourcesBody").innerHTML = `<div class="empty">尚未发现源站，请点击「刷新源站列表」</div>`;
      return;
    }
    const rows = list.map((s) => {
      // running = 此刻真的有同步任务在跑（后端进程内运行态），只有它才需要「暂停」
      // syncing = 全量还有断点没跑完，仅用于展示进度条，不代表正在跑
      const running = !!s.running;
      const isFull = s.running_mode === "full";
      const fullPaused = pauseState.global || pauseState.full;
      const pct = Math.max(0, Math.min(100, Number(s.progress || 0)));
      const elapsed = s.running_seconds != null ? ` · ${fmtDur(s.running_seconds)}` : "";
      let prog;
      if (running && isFull) {
        const pageTxt = s.total_pages
          ? `第 ${fmtNum(s.last_page)} / ${fmtNum(s.total_pages)} 页`
          : "正在读取首页数据…";
        prog = `<div class="row" style="gap:6px"><div class="bar" style="flex:1"><i class="live" style="width:${pct}%"></i></div><span class="muted num" style="font-size:11.5px">${pct}%</span></div>
           <div class="muted" style="font-size:11px">${pageTxt}${elapsed}${(fullPaused || s.paused) ? ' · <span class="badge warn">已暂停</span>' : ""}</div>`;
      } else if (running) {
        prog = `<span class="badge run">正在增量同步</span><div class="muted" style="font-size:11px;margin-top:2px">已运行${elapsed.replace(" · ", " ")}</div>`;
      } else if (s.paused) {
        prog = s.syncing
          ? `<div class="row" style="gap:6px"><div class="bar" style="flex:1"><i style="width:${pct}%"></i></div><span class="muted num" style="font-size:11.5px">${pct}%</span></div>
             <div class="muted" style="font-size:11px">已暂停于第 ${fmtNum(s.last_page)} / ${fmtNum(s.total_pages)} 页</div>`
          : `<span class="badge warn">已暂停</span>`;
      } else if (s.syncing) {
        prog = `<div class="row" style="gap:6px"><div class="bar" style="flex:1"><i style="width:${pct}%"></i></div><span class="muted num" style="font-size:11.5px">${pct}%</span></div>
           <div class="muted" style="font-size:11px">断点第 ${fmtNum(s.last_page)} / ${fmtNum(s.total_pages)} 页 · 未在同步</div>`;
      } else {
        prog = `<span class="badge ok">已完成</span>`;
      }
      // 操作列：暂停只在运行中出现；已暂停的站保留「继续」以便随时解除
      let pauseBtn = "";
      if (running && !s.paused) {
        pauseBtn = `<button class="sm warn" data-act="pause" data-slug="${esc(s.slug)}">暂停</button>`;
      } else if (s.paused) {
        pauseBtn = `<button class="sm primary" data-act="resume" data-slug="${esc(s.slug)}">继续</button>`;
      }
      return `<tr>
        <td>
          <div class="name">${esc(s.name)}</div>
          <div class="slugcode">${esc(s.slug)}</div>
        </td>
        <td>${s.status === "ok" ? '<span class="badge ok">在线</span>' : '<span class="badge bad">离线</span>'}${s.paused ? ' <span class="badge warn">本站暂停</span>' : ""}</td>
        <td class="num">${fmtNum(s.total_videos)}</td>
        <td style="min-width:130px">${prog}</td>
        <td class="muted num" style="font-size:12px">${esc(s.watermark || "-")}</td>
        <td class="muted num" style="font-size:12px">${fmtTime(s.last_sync_at)}</td>
        <td style="white-space:nowrap">
          <button class="sm" data-act="incr" data-slug="${esc(s.slug)}">增量</button>
          <button class="sm" data-act="full" data-slug="${esc(s.slug)}">全量</button>
          <button class="sm" data-act="detail" data-slug="${esc(s.slug)}">日志</button>
          ${pauseBtn}
        </td>
      </tr>`;
    }).join("");
    $("#sourcesBody").innerHTML = `<table>
      <thead><tr>
        <th>源站</th><th>状态</th><th>已入库</th><th>全量进度</th><th>增量水位线</th><th>最后同步</th><th>操作</th>
      </tr></thead><tbody>${rows}</tbody></table>`;
  } catch (e) { toast("源站列表加载失败：" + e.message, true); }
}

// ---------------- 日志 ----------------
async function loadLogs() {
  try {
    const data = await api("/api/v1/logs?limit=20");
    const list = data.list || [];
    if (!list.length) { $("#logsBody").innerHTML = `<div class="empty">暂无同步记录</div>`; return; }
    const rows = list.map((l) => {
      const badge = l.status === "success" ? '<span class="badge ok">成功</span>'
        : l.status === "failed" ? '<span class="badge bad">失败</span>'
        : l.status === "paused" ? '<span class="badge warn">已暂停</span>'
        : '<span class="badge warn">进行中</span>';
      const mode = l.mode === "full" ? '<span class="badge mute">全量</span>' : '<span class="badge mute">增量</span>';
      return `<tr>
        <td class="slugcode">${esc(l.slug)}</td>
        <td>${mode}</td>
        <td>${badge}</td>
        <td class="num">${fmtNum(l.fetched)}</td>
        <td class="num">${fmtNum(l.inserted)}</td>
        <td class="num">${fmtNum(l.updated)}</td>
        <td class="num">${fmtNum(l.pages)}</td>
        <td class="muted num" style="font-size:12px">${fmtTime(l.started_at)}</td>
        <td class="muted" style="font-size:12px;max-width:280px;overflow:hidden;text-overflow:ellipsis">${esc(l.error || "")}</td>
      </tr>`;
    }).join("");
    $("#logsBody").innerHTML = `<table>
      <thead><tr>
        <th>源站</th><th>模式</th><th>结果</th><th>抓取</th><th>新增</th><th>更新</th><th>页数</th><th>开始时间</th><th>错误</th>
      </tr></thead><tbody>${rows}</tbody></table>`;
  } catch (e) { toast("日志加载失败：" + e.message, true); }
}

// ---------------- 操作 ----------------
async function triggerSync(slug, mode) {
  try {
    await api(`/api/v1/sync/${encodeURIComponent(slug)}?mode=${mode}`, { method: "POST" });
    toast(`${slug} 已提交${mode === "full" ? "全量" : "增量"}同步任务`);
    setTimeout(refreshAll, 1200);
  } catch (e) { toast("提交失败：" + e.message, true); }
}

$("#sourcesBody").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-act]");
  if (!btn) return;
  const slug = btn.dataset.slug, act = btn.dataset.act;
  if (act === "detail") return showSourceLogs(slug);
  if (act === "pause" || act === "resume") return toggleSourcePause(slug, act === "pause");
  if (act === "full" && !window.confirm(`确认对 ${slug} 从第一页重新全量同步？（数据量大时耗时较长）`)) return;
  triggerSync(slug, act === "full" ? "full" : "incremental");
});

// 单源站暂停 / 继续
async function toggleSourcePause(slug, want) {
  const path = `/api/v1/sources/${encodeURIComponent(slug)}/${want ? "pause" : "resume"}`;
  try {
    const res = await api(path, { method: "POST" });
    toast(res.msg || (want ? "已暂停该源站" : "已继续该源站"));
    await Promise.allSettled([loadSources(), loadStats()]);
  } catch (e) {
    toast((want ? "暂停" : "继续") + "失败：" + e.message, true);
  }
}

async function showSourceLogs(slug) {
  try {
    const d = await api(`/api/v1/sources/${encodeURIComponent(slug)}`);
    const s = d.source, logs = d.recent_logs || [];
    const rows = logs.map((l) => `<tr>
      <td>${esc(l.mode)}</td><td>${esc(l.status)}</td>
      <td class="num">${fmtNum(l.inserted)}</td><td class="num">${fmtNum(l.updated)}</td>
      <td class="num">${fmtNum(l.pages)}</td><td class="muted" style="font-size:12px">${fmtTime(l.started_at)}</td>
    </tr>`).join("");
    openModal(`源站详情：${esc(s.name)}`, `
      <div class="kv">
        <span>slug: <span class="slugcode">${esc(s.slug)}</span></span>
        <span>API: <span class="slugcode">${esc(s.api_url)}</span></span>
        <span>已入库 ${fmtNum(s.total_videos)} 条</span>
        <span>水位线 ${esc(s.watermark || "-")}</span>
      </div>
      <table><thead><tr><th>模式</th><th>结果</th><th>新增</th><th>更新</th><th>页数</th><th>时间</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="muted">暂无记录</td></tr>'}</tbody></table>`);
  } catch (e) { toast("详情加载失败：" + e.message, true); }
}

async function refreshSources(full) {
  try {
    await api(`/api/v1/sources/refresh?full_sync=${full ? "true" : "false"}`, { method: "POST" });
    toast("已刷新源站列表" + (full ? "，新源站开始全量同步" : ""));
    setTimeout(refreshAll, 1500);
  } catch (e) { toast("刷新失败：" + e.message, true); }
}

$("#btnRefreshSources").onclick = () => refreshSources(false);
$("#btnReload").onclick = () => refreshAll();
$("#btnSourceApi").onclick = () => window.open("/source", "_blank", "noopener");
$("#btnRecount").onclick = async () => {
  try {
    await api("/api/v1/maintenance/recount", { method: "POST" });
    toast("条数校准任务已提交，稍后自动刷新");
    setTimeout(refreshAll, 2000);
  } catch (e) { toast("提交失败：" + e.message, true); }
};
$("#btnSyncAll").onclick = async () => {
  try {
    await api("/api/v1/sync-all?mode=auto", { method: "POST" });
    toast("已提交全站增量同步");
    setTimeout(refreshAll, 1200);
  } catch (e) { toast("提交失败：" + e.message, true); }
};
$("#btnSyncAllFull").onclick = async () => {
  if (!window.confirm("确认对全部源站执行全量同步？该操作会重新抓取所有数据，耗时很长。")) return;
  try {
    await api("/api/v1/sync-all?mode=full", { method: "POST" });
    toast("已提交全站全量同步");
    setTimeout(refreshAll, 1200);
  } catch (e) { toast("提交失败：" + e.message, true); }
};

// ---------------- 聚合搜索 ----------------
$("#searchForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const wd = $("#searchInput").value.trim();
  if (!wd) return;
  $("#searchResults").innerHTML = `<div class="empty">搜索中…</div>`;
  $("#searchInfo").textContent = "";
  try {
    const d = await api(`/api/v1/search?wd=${encodeURIComponent(wd)}&page_size=30`);
    $("#searchInfo").textContent =
      `命中 ${fmtNum(d.total)} 条 · 搜索 ${d.sources_searched} 个源站 · 耗时 ${d.elapsed_ms}ms` +
      (d.total_is_partial ? "（部分源站结果已截断）" : "");
    if (!d.list.length) { $("#searchResults").innerHTML = `<div class="empty">没有找到「${esc(wd)}」相关影片</div>`; return; }
    $("#searchResults").innerHTML = d.list.map((it) => `
      <div class="result-item">
        <img src="${esc(it.vod_pic || "")}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="meta">
          <div class="title">${esc(it.vod_name)}</div>
          <div class="line2">
            <span class="badge mute">${esc(it.source_name)}</span>
            <span>${esc(it.type_name || "未分类")}</span>
            <span>${esc(it.vod_remarks || "")}</span>
            <span>${esc(it.vod_time || "")}</span>
          </div>
        </div>
        <div><button class="sm" data-detail="${esc(it.source)}|${it.vod_id}">详情</button></div>
      </div>`).join("");
  } catch (e) {
    $("#searchResults").innerHTML = `<div class="empty">搜索失败：${esc(e.message)}</div>`;
  }
});

$("#searchResults").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-detail]");
  if (!btn) return;
  const [slug, id] = btn.dataset.detail.split("|");
  try {
    const d = await api(`/api/v1/videos/${encodeURIComponent(slug)}/${id}`);
    const v = d.detail;
    const lines = (v.vod_play_list || []).map((line, i) => {
      const eps = line.episodes.slice(0, 40).map((ep) =>
        `<a class="ep" href="${esc(ep.url)}" target="_blank" rel="noreferrer">${esc(ep.name)}</a>`).join("");
      const more = line.episodes.length > 40 ? `<span class="muted" style="font-size:12px">… 共 ${line.episodes.length} 集</span>` : "";
      return `<div style="margin-top:8px"><div class="muted" style="font-size:12px">线路 ${i + 1}</div>${eps}${more}</div>`;
    }).join("") || '<span class="muted">无播放地址</span>';
    openModal(esc(v.vod_name), `
      <div class="kv">
        <span class="badge mute">${esc(v.source)}</span>
        <span>${esc(v.type_name || "未分类")}</span>
        <span>${esc(v.vod_remarks || "")}</span>
        <span>更新 ${esc(v.vod_time || "-")}</span>
        <span>ID ${v.vod_id}</span>
      </div>
      <div class="content">${esc(v.vod_content || "（无简介）")}</div>
      <div style="margin-top:12px">${lines}</div>`);
  } catch (e) { toast("详情加载失败：" + e.message, true); }
});

// ---------------- 弹窗 ----------------
function openModal(title, bodyHtml) {
  const mask = document.createElement("div");
  mask.className = "modal-mask";
  mask.innerHTML = `<div class="modal">
    <h3>${title}</h3>
    ${bodyHtml}
    <div style="margin-top:16px;text-align:right"><button data-close>关闭</button></div>
  </div>`;
  mask.addEventListener("click", (e) => {
    if (e.target === mask || e.target.hasAttribute("data-close")) mask.remove();
  });
  document.body.appendChild(mask);
}

// ---------------- 刷新循环 ----------------
let timer = null;
async function refreshAll() {
  await Promise.allSettled([loadStats(), loadSources(), loadLogs(), loadPause()]);
}
function schedule() {
  if (timer) clearInterval(timer);
  if ($("#autoRefresh").checked) {
    timer = setInterval(() => { if (!document.hidden) refreshAll(); }, 5000);
  }
}
$("#autoRefresh").addEventListener("change", schedule);

refreshAll();
schedule();
</script>
</body>
</html>
