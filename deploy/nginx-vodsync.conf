# vodsync HTTPS 反向代理（Nginx）样例 —— v1.14.0 / B-09
#
# 目标：让 Token 不再经明文 HTTP 传输，同时**保留** 8181 明文端口至少一个版本周期
# （旧客户端不改配置也能用，切换失败可立即回退）。
#
# 为什么必须用公共 CA 证书（Let's Encrypt 等）：
#   Android 7+ 不信任用户自签 CA。自签证书会让所有 App 请求直接握手失败，
#   表现为「服务连不上」，而不是证书警告 —— 排查成本极高。
#
# 用法：
#   1. certbot --nginx -d vodsync.example.com          # 自动签发并配置续期
#   2. 把下面的 server 块合并进你的站点配置（路径按需改）
#   3. nginx -t && nginx -s reload
#   4. curl -sI https://vodsync.example.com/healthz | head -1     # 期望 200
#   5. curl -s  http://vodsync.example.com:8181/healthz -o /dev/null -w '%{http_code}\n'  # 并行期仍 200
#
# 注意：本项目容器内监听 8000，宿主机映射 8181（见 docker-compose.yml）。
# 下面的 upstream 直接指向宿主机的 8181，Nginx 跑在宿主机上时用 127.0.0.1；
# 跑在容器里时把 127.0.0.1 换成 vodsync（容器名）或宿主机内网 IP。
#
# ⚠️ upstream 严禁写公网域名（如 mosang.asia）：
#   1. Windows 下的 Nginx 只用 A 记录解析 upstream 域名，域名若只有 AAAA
#      （IPv6）记录，连接直接失败 —— os error 11004，公网入口全线 502；
#   2. 就算解析成功，流量也要绕公网回自己，多一跳 DNS/网络故障面。
#   见 docs/DEPLOY_HTTPS.md 第 7 节排障。

upstream vodsync_backend {
    server 127.0.0.1:8181;
    keepalive 16;
}

# ---- HTTP -> HTTPS 跳转（HSTS 生效前先用这个，避免用户手输 http:// 打不开）----
server {
    listen 80;
    listen [::]:80;
    server_name vodsync.example.com;

    # certbot 续期校验路径必须放行，且不能被 301 掉
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vodsync.example.com;

    ssl_certificate     /etc/letsencrypt/live/vodsync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vodsync.example.com/privkey.pem;

    # 只留 TLS 1.2 / 1.3：Android 5 以下才需要 1.0/1.1，而 v1.5.x 客户端最低要求
    # 早就高于它；留着旧协议只会拖低整体安全评级
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- HSTS ----
    # 先注释掉，等「确认所有客户端默认地址已改成 https」再打开。
    # 一旦下发，浏览器会在 max-age 内强制 https，http 回退等于不可用（App 走 OkHttp 不受影响，
    # 但面板在浏览器里访问会立刻跳转）。
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- 压缩 ----
    # 详情响应可能 700+ 集；play_lines 与 vod_play_list 是同值双发，gzip 能吃掉这份重复
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain text/html application/xml;

    # ---- 超时 ----
    # 全量同步是后台线程，接口本身很快；但详情大响应 + 慢网络需要留足时间
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;     # ≥30s，别用默认 60 以下的激进值

    client_max_body_size 8m;       # 词库批量粘贴/自定义源站表单

    location / {
        proxy_pass http://vodsync_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";              # 配合 upstream keepalive

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 关键：XFF 必须由反代「覆盖」而不是追加，否则客户端可伪造来源 IP，
        # 面板的登录失败锁定形同虚设。后端要配合 TRUST_PROXY=true 才采信它。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 鉴权头必须透传，丢一个就是整站 401
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-API-Key         $http_x_api_key;
        proxy_set_header X-Client-Version  $http_x_client_version;

        # 流式返回（面板轮询/大响应）不要缓冲到磁盘
        proxy_buffering off;
    }

    # 健康检查单独放行并关掉访问日志，避免 5 秒一次探针刷爆日志
    location = /healthz {
        proxy_pass http://vodsync_backend/healthz;
        proxy_set_header Host $host;
        access_log off;
    }
}
