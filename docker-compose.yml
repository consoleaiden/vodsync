# 群晖 Container Manager / 通用 docker-compose 部署模板
# 用法：把本项目放到 /volume1/docker/vodsync/ 后，Container Manager -> 项目 -> 新增 -> 使用此文件
services:
  vodsync:
    # 官方发布镜像（GitHub Actions 自动构建，双架构 amd64/arm64，公开可拉取）
    image: ghcr.io/consoleaiden/vodsync:latest
    # 本地构建模式：注释掉上面 image 行，改用下面 build
    # build: .
    container_name: vodsync
    restart: unless-stopped
    ports:
      - "8181:8000"               # 宿主机端口:容器端口，左侧按需修改
    volumes:
      - /volume1/docker/vodsync/data:/app/data   # SQLite 数据库持久化目录（必须）
    environment:
      # ---- 数据源 ----
      LATEST_JSON_URL: "https://mylazily.github.io/ziyuanzhan/data/latest.json"
      ONLY_OK_SOURCES: "true"              # 只同步在线源站
      FULL_SYNC_ON_DISCOVER: "true"        # 发现新源站立即全量同步
      # ---- 调度 ----
      SYNC_INTERVAL_MINUTES: "360"         # 增量同步间隔（分钟），默认 6 小时
      SOURCE_REFRESH_INTERVAL_MINUTES: "720"  # 源站列表刷新间隔（分钟）
      SOURCE_SYNC_CONCURRENCY: "2"         # 同时真正在跑的源站同步数上限（超出排队；NAS 建议 1-2）
      PAGE_CONCURRENCY: "4"                # 单源站内并行抓取页数
      REQUEST_INTERVAL_SECONDS: "0.3"      # 请求间隔，防源站封禁
      # ---- 数据库连接池（连接池耗尽会导致接口 500/503，见 README 常见坑第 7 条）----
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
      DB_POOL_TIMEOUT: "10"                # 等连接超时（秒），超时返回 503 让客户端退避
      SEARCH_CONCURRENCY: "4"              # 聚合搜索并行度
      # ---- 中转代理（源站直连失败时自动降级）----
      PROXY_ENABLED: "true"
      PROXY_URLS: "https://pz.v88.qzz.io/,https://mconfig.viptv.work/"
      PROXY_PREF_TTL_MINUTES: "30"         # 走代理成功的源站，多久后重试直连
      PROXY_CONCURRENCY: "4"               # 每个代理的并发上限
      # ---- 数据库 ----
      # 默认 SQLite（推荐），如需 PostgreSQL 打开下行并连接外部 PG 容器：
      # DATABASE_URL: "postgresql+psycopg2://vodsync:vodsync@postgres:5432/vodsync"
      # ---- API ----
      API_PAGE_SIZE_DEFAULT: "20"
      API_KEY: ""                          # 留空不鉴权；设置后请求需带 X-API-Key 头
      TZ: "Asia/Shanghai"

  # ---- 可选：PostgreSQL（数据量超大或多实例共享时启用） ----
