# 群晖 Container Manager / 通用 docker-compose 部署模板
# 用法：把本项目放到 /volume1/docker/vodsync/ 后，Container Manager -> 项目 -> 新增 -> 使用此文件
#
# v1.7.0 起数据库固定为 PostgreSQL（同一个 compose 里带一个 postgres 服务），
# SQLite 只保留给自动化测试，不作为部署选项。
#
# ★ 从旧版本升级时，先核对这 4 项，否则会连到一个空库并触发全量重新同步：
#   1. postgres 的 volumes 路径 —— 必须指向**现有 pgdata 所在目录**（本模板写 /volume1，
#      如果你的库在 /volume2 或其他盘，务必改掉）
#   2. POSTGRES_PASSWORD —— 必须与 pgdata 初始化时设的密码一致（不是改这里就能改密码）
#   3. DATABASE_URL 里的密码/端口 —— 要与上面一致
#   4. 若已有名为 vodsync-pg 的容器由别的 compose 项目管理，先 docker rm -f vodsync-pg，
#      否则这里会报 container name already in use
services:
  vodsync:
    # 官方发布镜像（GitHub Actions 自动构建，双架构 amd64/arm64，公开可拉取）
    # tag 说明（v1.9.3 起每次构建都带版本号；当前版本 1.12.2）：
    #   latest         最新（生产默认）
    #   1.12.2         版本号；同一版本多次构建时指向最新那次
    #   1.12.0-e4953c9 版本 + 提交，不可变 —— **回滚就用这个**
    #   sha-e4953c9    仅提交短 SHA，不可变
    # 回滚示例：把下面这行改成旧版本 tag，然后 docker compose pull vodsync && docker compose up -d
    #   例：image: ghcr.io/consoleaiden/vodsync:1.10.1-4f249a7
    # 回滚后 curl http://127.0.0.1:8181/healthz 核对 version / build 是否已是目标版本
    image: ghcr.io/consoleaiden/vodsync:latest
    # 本地构建模式：注释掉上面 image 行，改用下面 build
    # build: .
    container_name: vodsync
    restart: unless-stopped
    ports:
      - "8181:8000"               # 宿主机端口:容器端口，左侧按需修改
    volumes:
      # 数据库在 postgres 容器里，这里只放断点状态（pause_state.json）与日志
      - /volume1/docker/vodsync/data:/app/data
    environment:
      # ---- 数据库（必填；用户/密码/库名要与下面 postgres 服务一致）----
      DATABASE_URL: "postgresql+psycopg2://vodsync:vodsync@postgres:5432/vodsync"
      # ---- 数据源 ----
      LATEST_JSON_URL: "https://mylazily.github.io/ziyuanzhan/data/latest.json"
      ONLY_OK_SOURCES: "true"              # 只同步在线源站
      FULL_SYNC_ON_DISCOVER: "true"        # 发现新源站立即全量同步
      # ---- 调度 ----
      SYNC_INTERVAL_MINUTES: "360"         # 增量同步间隔（分钟），默认 6 小时
      SOURCE_REFRESH_INTERVAL_MINUTES: "720"  # 源站列表刷新间隔（分钟）
      SOURCE_SYNC_CONCURRENCY: "2"         # 同时真正在跑的源站同步数上限（超出排队）
      PAGE_CONCURRENCY: "4"                # 单源站内并行抓取页数
      PAGE_MAX_ATTEMPTS: "3"               # 同一页最多重试几次，超过就中止并保留断点
      REQUEST_INTERVAL_SECONDS: "0.3"      # 请求间隔，防源站封禁
      # ---- 断电/重启恢复（v1.6.0）----
      AUTO_RESUME_ON_BOOT: "true"          # 启动时自动续跑有断点的全量同步
      AUTO_RESUME_DELAY_SECONDS: "30"      # 延迟多久开始续跑（等服务先起来）
      # ---- 数据库连接池 ----
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
      DB_POOL_TIMEOUT: "10"                # 等连接超时（秒），超时返回 503 让客户端退避
      SEARCH_CONCURRENCY: "4"              # 聚合搜索并行度
      # ---- 多源列表查询（v1.7.0）----
      MERGE_MAX_PER_TABLE: "3000"          # 每表参与归并的最大行数（= 最深支持 3000/page_size 页）
      MERGE_CONCURRENCY: "4"               # 归并查询并行度（每个线程一个连接）
      TOTAL_CACHE_SECONDS: "60"            # 列表 total 的缓存秒数
      # ---- 数据维护（v1.7.0）----
      HOUSEKEEPING_ENABLED: "true"
      HOUSEKEEPING_INTERVAL_MINUTES: "60"  # 清理同步日志的间隔
      SYNC_LOG_RETENTION_DAYS: "30"        # 同步日志保留天数
      SYNC_LOG_KEEP_PER_SOURCE: "50"       # 每个源站最多保留多少条
      SYNC_LOG_MAX_ROWS: "20000"           # 全表行数上限
      # ---- 中转代理（源站直连失败时自动降级）----
      PROXY_ENABLED: "true"
      PROXY_URLS: "https://pz.v88.qzz.io/,https://mconfig.viptv.work/"
      PROXY_PREF_TTL_MINUTES: "30"         # 走代理成功的源站，多久后重试直连
      PROXY_CONCURRENCY: "4"               # 每个代理的并发上限
      # ---- 访问控制（v1.5.0）：面板登录 + API Token ----
      AUTH_ENABLED: "true"                 # 首次启动写入数据库，之后在面板「⚙ 设置」里改
      ADMIN_PASSWORD: "666666"             # 首次启动的面板密码，登录后请改掉
      SESSION_TTL_DAYS: "7"                # 登录会话有效期（天）
      TRUST_PROXY: "false"                 # 部署在 Nginx/群晖反代之后才改 true（否则 XFF 可伪造，绕过登录锁定）
      # 兼容项：设置后作为一枚额外有效的 API Token
      # API_KEY: ""
      # ---- API ----
      API_PAGE_SIZE_DEFAULT: "30"          # 每页条数：App 三列 × 10 行 = 30（上限见 API_PAGE_SIZE_MAX）
      TZ: "Asia/Shanghai"
    depends_on:
      postgres:
        # 等 PG 真正可接受连接再启动，避免 vodsync 比库先起而 CrashLoop
        condition: service_healthy

  # ---- PostgreSQL（v1.7.0 起必备）----
  # 数据卷建议放在 SSD 上：220 万行 + 索引约 2~4GB，机械盘上全量同步会明显拖慢。
  # 升级大版本（如 16 → 17）前先 pg_dump 备份，pgdata 不能跨大版本直接复用。
  postgres:
    image: postgres:16-alpine
    container_name: vodsync-pg
    restart: unless-stopped
    shm_size: "256mb"                 # 默认 64MB 不够并行查询排序用，容易报 out of shared memory
    environment:
      POSTGRES_USER: vodsync
      POSTGRES_PASSWORD: vodsync     # 对外只走容器网络的在这可以不改；映射到宿主机就必须改
      POSTGRES_DB: vodsync
      TZ: Asia/Shanghai
      # NAS 内存调优（可选，按机器内存来）：
      #   postgres 默认 shared_buffers=128MB、work_mem=4MB，
      #   4~8G 内存的 NAS 建议 shared_buffers=256MB、work_mem=16MB（多源归并/排序吃 work_mem）
      # 取消下面两行的注释即可，改完 docker compose up -d 会重建容器生效
      # POSTGRES_INITDB_ARGS: "--data-checksums"
    #   command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=16MB"]
    volumes:
      # ★ 按你实际的 SSD 路径改；与上面 vodsync 的 data 卷同一前缀
      - /volume1/docker/vodsync/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vodsync -d vodsync"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # 不要映射 5432 到宿主机：容器之间直连用服务名即可，映射反而容易和已有 PG 抢端口。
    # 只有在宿主机上要用 psql/客户端连进来时才解开（并改左侧端口避开冲突）：
    # ports:
    #   - "5433:5432"
